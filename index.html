<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Achmad Raffa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="style.css" rel="stylesheet"> 
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-sm bg-gray-800 rounded-2xl shadow-2xl p-6 space-y-4">
        
        <div class="text-center p-2 rounded-lg bg-emerald-600 shadow-md">
            <p class="text-xs font-semibold">Kalkulator Achmad Raffa Adhitya Wibowo</p>
            <p class="text-sm font-bold">NIM: 1710624159</p>
        </div>

        <div>
            <img id="statusImage" 
                 src="https://placehold.co/400x100/10B981/000000?text=CALCULATOR+READY" 
                 alt="Status Kalkulator"
                 class="w-full rounded-lg transition-all duration-300 ease-in-out shadow-inner">
        </div>

        <div class="bg-gray-900 rounded-lg p-4 shadow-inner border border-emerald-500">
            <input type="text" id="display" 
                   class="w-full bg-transparent text-right text-5xl font-mono text-white border-0 outline-none p-2" 
                   readonly 
                   placeholder="0">
        </div>

        <div class="grid grid-cols-4 gap-3">
            <button data-value="C" class="btn-calc text-2xl font-bold bg-red-600 hover:bg-red-500 rounded-lg p-5 shadow-lg text-white">C</button>
            <button data-value="DEL " class="btn-calc text-2xl font-bold bg-gray-600 hover:bg-gray-500 rounded-lg p-5 shadow-lg text-white">DEL</button>
            <button data-value="%" class="btn-calc text-2xl font-bold bg-gray-600 hover:bg-gray-500 rounded-lg p-5 shadow-lg text-white">%</button>
            <button data-value="/" class="btn-calc text-2xl font-bold bg-emerald-600 hover:bg-emerald-500 rounded-lg p-5 shadow-lg text-white">/</button>

            <button data-value="7" class="btn-calc text-2xl font-bold bg-gray-700 hover:bg-gray-600 rounded-lg p-5 shadow-lg text-white">7</button>
            <button data-value="8" class="btn-calc text-2xl font-bold bg-gray-700 hover:bg-gray-600 rounded-lg p-5 shadow-lg text-white">8</button>
            <button data-value="9" class="btn-calc text-2xl font-bold bg-gray-700 hover:bg-gray-600 rounded-lg p-5 shadow-lg text-white">9</button>
            <button data-value="*" class="btn-calc text-2xl font-bold bg-emerald-600 hover:bg-emerald-500 rounded-lg p-5 shadow-lg text-white">*</button>

            <button data-value="4" class="btn-calc text-2xl font-bold bg-gray-700 hover:bg-gray-600 rounded-lg p-5 shadow-lg text-white">4</button>
            <button data-value="5" class="btn-calc text-2xl font-bold bg-gray-700 hover:bg-gray-600 rounded-lg p-5 shadow-lg text-white">5</button>
            <button data-value="6" class="btn-calc text-2xl font-bold bg-gray-700 hover:bg-gray-600 rounded-lg p-5 shadow-lg text-white">6</button>
            <button data-value="-" class="btn-calc text-2xl font-bold bg-emerald-600 hover:bg-emerald-500 rounded-lg p-5 shadow-lg text-white">-</button>

            <button data-value="1" class="btn-calc text-2xl font-bold bg-gray-700 hover:bg-gray-600 rounded-lg p-5 shadow-lg text-white">1</button>
            <button data-value="2" class="btn-calc text-2xl font-bold bg-gray-700 hover:bg-gray-600 rounded-lg p-5 shadow-lg text-white">2</button>
            <button data-value="3" class="btn-calc text-2xl font-bold bg-gray-700 hover:bg-gray-600 rounded-lg p-5 shadow-lg text-white">3</button>
            <button data-value="+" class="btn-calc text-2xl font-bold bg-emerald-600 hover:bg-emerald-500 rounded-lg p-5 shadow-lg text-white">+</button>

            <button data-value="0" class="btn-calc col-span-2 text-2xl font-bold bg-gray-700 hover:bg-gray-600 rounded-lg p-5 shadow-lg text-white">0</button>
            <button data-value="." class="btn-calc text-2xl font-bold bg-gray-700 hover:bg-gray-600 rounded-lg p-5 shadow-lg text-white">.</button>
            <button data-value="=" class="btn-calc text-2xl font-bold bg-green-600 hover:bg-green-500 rounded-lg p-5 shadow-lg text-white">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
